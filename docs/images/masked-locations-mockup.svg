<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <style>
      .frame { fill: #FFFFFF; stroke: #E8E3F1; stroke-width: 1.5; }
      .caption { fill: #201B2C; font-size: 20px; font-weight: 700; }
      .sub { fill: #6B6675; font-size: 13px; }
      .title { fill: #201B2C; font-size: 15px; font-weight: 700; }
      .desc { fill: #6B6675; font-size: 11px; }
      .section { fill: #201B2C; font-size: 12px; font-weight: 700; }
      .input { fill: #FFFFFF; stroke: #DDDDDD; }
      .placeholder { fill: #9CA3AF; font-size: 11px; }
      .btn { fill: #6366F1; }
      .btnText { fill: #FFFFFF; font-size: 11px; font-weight: 700; }
      .item { fill: #FFFFFF; stroke: #DDDDDD; }
      .itemText { fill: #333333; font-size: 12px; }
      .editBtn { fill: #F3F4F6; }
      .editText { fill: #333333; font-size: 10px; }
      .delBtn { fill: #EF4444; }
      .delText { fill: #FFFFFF; font-size: 10px; }
      .arrow { fill: #7C3AED; font-size: 20px; font-weight: 700; }
      .row { fill: #FAF9FC; stroke: #EFEAF7; }
      .maskedText { fill: #9CA3AF; font-size: 12px; font-weight: 700; }
      .plainText { fill: #201B2C; font-size: 12px; }
      .badge { fill: #FEF2F2; stroke: #FCA5A5; }
      .badgeText { fill: #B91C1C; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Left: settings screen -->
  <g>
    <text x="20" y="28" class="caption">設定画面：出発地・到着地マスク設定</text>
    <text x="20" y="48" class="sub">アカウントメニュー → 出発地・到着地マスク設定</text>
    <rect x="20" y="64" width="500" height="336" rx="14" class="frame"/>

    <g transform="translate(44,90)">
      <text x="0" y="0" class="title">出発地・到着地マスク設定</text>
      <text x="0" y="20" class="desc">共有ページでマスクしたい駅名を設定します。設定した駅名は「***」として表示されます。</text>

      <text x="0" y="50" class="section">新規追加</text>
      <rect x="0" y="58" width="330" height="34" rx="8" class="input"/>
      <text x="12" y="79" class="placeholder">駅名を入力</text>
      <rect x="340" y="58" width="80" height="34" rx="8" class="btn"/>
      <text x="380" y="79" class="btnText" text-anchor="middle">追加</text>

      <text x="0" y="120" class="section">設定済み駅名</text>
      <rect x="0" y="130" width="420" height="44" rx="8" class="item"/>
      <text x="14" y="157" class="itemText">東京</text>
      <rect x="290" y="140" width="52" height="24" rx="6" class="editBtn"/>
      <text x="316" y="156" class="editText" text-anchor="middle">編集</text>
      <rect x="350" y="140" width="52" height="24" rx="6" class="delBtn"/>
      <text x="376" y="156" class="delText" text-anchor="middle">削除</text>

      <rect x="0" y="182" width="420" height="44" rx="8" class="item"/>
      <text x="14" y="209" class="itemText">品川</text>
      <rect x="290" y="192" width="52" height="24" rx="6" class="editBtn"/>
      <text x="316" y="208" class="editText" text-anchor="middle">編集</text>
      <rect x="350" y="192" width="52" height="24" rx="6" class="delBtn"/>
      <text x="376" y="208" class="delText" text-anchor="middle">削除</text>
    </g>
  </g>

  <g transform="translate(540,180)">
    <text x="0" y="8" class="arrow">→</text>
    <text x="-6" y="34" class="sub">共有ページに反映</text>
  </g>

  <!-- Right: effect on share page -->
  <g transform="translate(620,0)">
    <text x="20" y="28" class="caption">共有ページでの見え方</text>
    <text x="20" y="48" class="sub">マスク対象の駅名は自分だけでなく、閲覧者にも非公開になります</text>
    <rect x="20" y="64" width="540" height="336" rx="14" class="frame"/>

    <g transform="translate(44,92)">
      <text x="0" y="0" class="section">交通情報（マスク設定前）</text>
      <rect x="0" y="10" width="480" height="48" rx="8" class="row"/>
      <text x="14" y="30" class="plainText">出発地: 東京</text>
      <text x="14" y="48" class="plainText">到着地: 品川</text>

      <text x="0" y="86" class="section">交通情報（マスク設定後・共有ページ表示）</text>
      <rect x="0" y="96" width="480" height="48" rx="8" class="row"/>
      <text x="14" y="116" class="maskedText">出発地: ***</text>
      <text x="14" y="134" class="maskedText">到着地: ***</text>
      <rect x="380" y="102" width="88" height="22" rx="11" class="badge"/>
      <text x="424" y="117" class="badgeText" text-anchor="middle">非公開</text>

      <text x="0" y="172" font-size="11" fill="#9CA3AF">※ 出発地・到着地のどちらか一方だけを登録した駅名も、一致すればマスクされます</text>
      <text x="0" y="192" font-size="11" fill="#9CA3AF">※ マスクはユーザーごとの設定で、ログイン中の画面では通常どおり表示されます</text>
    </g>
  </g>
</svg>
