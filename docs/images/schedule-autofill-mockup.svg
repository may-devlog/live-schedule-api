<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#2E1065" flood-opacity=".08"/></filter>
    <style>
      .ink{fill:#201B2C}.muted{fill:#6B6675}.purple{fill:#7C3AED}.soft{fill:#F5F3FF}.border{stroke:#E8E3F1}.label{font-size:13px;font-weight:700;fill:#201B2C}.small{font-size:12px;fill:#6B6675}.value{font-size:14px;fill:#201B2C}.button{font-size:13px;font-weight:700}.hint{font-size:11px;fill:#6B6675}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F6FA"/>
  <rect width="1440" height="64" fill="#FFFFFF" stroke="#E8E3F1"/>
  <circle cx="54" cy="32" r="15" fill="#18181B"/><text x="80" y="38" class="ink" font-size="18" font-weight="800">GenBGT</text>
  <text x="1160" y="37" class="muted" font-size="13">カレンダー　年別　アカウント</text>

  <g transform="translate(180 104)">
    <text x="0" y="0" class="purple" font-size="11" font-weight="800" letter-spacing="2">EVENT</text>
    <text x="0" y="47" class="ink" font-size="36" font-weight="800">新規イベント</text>
    <text x="0" y="76" class="muted" font-size="14">ライブの基本情報や費用を登録します。</text>

    <rect x="0" y="110" width="1080" height="250" rx="16" fill="#FFFFFF" class="border" filter="url(#shadow)"/>
    <circle cx="34" cy="144" r="17" fill="#EDE9FE"/><path d="M26 145h16M34 137v16" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="140" class="ink" font-size="17" font-weight="800">URLまたは画像から自動入力</text>
    <text x="62" y="161" class="small">イベント情報を解析し、入力候補を作成します。保存前に内容を確認できます。</text>

    <rect x="28" y="184" width="96" height="34" rx="17" fill="#7C3AED"/><text x="76" y="206" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">URL</text>
    <rect x="132" y="184" width="96" height="34" rx="17" fill="#F5F3FF"/><text x="180" y="206" class="muted" font-size="12" font-weight="700" text-anchor="middle">画像</text>

    <rect x="28" y="234" width="824" height="48" rx="9" fill="#FFFFFF" stroke="#CFC8DB"/>
    <text x="44" y="264" class="value">https://shishamo.biz/news/detail/5914</text>
    <rect x="864" y="234" width="188" height="48" rx="9" fill="#7C3AED"/>
    <text x="958" y="264" fill="#FFFFFF" class="button" text-anchor="middle">情報を読み取る</text>
    <path d="M28 304h1024" stroke="#EFEAF7"/>
    <circle cx="39" cy="330" r="8" fill="#16A34A"/><path d="m35 330 3 3 5-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="56" y="334" font-size="12" fill="#166534">7項目を抽出しました。フォームに反映後、内容を確認してください。</text>
    <text x="1000" y="334" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="end">候補を確認</text>

    <rect x="0" y="386" width="1080" height="420" rx="16" fill="#FFFFFF" class="border" filter="url(#shadow)"/>
    <text x="28" y="424" class="ink" font-size="17" font-weight="800">抽出した入力候補</text>
    <rect x="858" y="404" width="194" height="42" rx="9" fill="#7C3AED"/><text x="955" y="430" fill="#fff" class="button" text-anchor="middle">フォームに反映</text>
    <text x="28" y="450" class="small">反映する項目を選べます。現在の入力値がある項目は上書き前に確認します。</text>

    <g transform="translate(28 478)">
      <rect width="500" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="16" y="18" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m20 27 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="48" y="23" class="hint">タイトル</text><text x="48" y="42" class="value">SHISHAMO THE FINAL!!! 〜Thanks for everything〜 THANKS DAY</text>
      <rect x="524" width="500" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="540" y="18" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m544 27 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="572" y="23" class="hint">日付</text><text x="572" y="42" class="value">2026-06-13</text>

      <rect y="70" width="238" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="16" y="88" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m20 97 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="48" y="93" class="hint">開場</text><text x="48" y="112" class="value">15:00</text>
      <rect x="262" y="70" width="238" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="278" y="88" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m282 97 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="310" y="93" class="hint">開演</text><text x="310" y="112" class="value">17:00</text>
      <rect x="524" y="70" width="238" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="540" y="88" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m544 97 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="572" y="93" class="hint">終演</text><text x="572" y="112" class="value">20:00</text>
      <rect x="786" y="70" width="238" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="802" y="88" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m806 97 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="834" y="93" class="hint">エリア</text><text x="834" y="112" class="value">神奈川</text>

      <rect y="140" width="1024" height="54" rx="9" fill="#FAF9FC" stroke="#EFEAF7"/><rect x="16" y="158" width="18" height="18" rx="4" fill="#7C3AED"/><path d="m20 167 4 4 7-9" stroke="#fff" fill="none" stroke-width="2"/><text x="48" y="163" class="hint">会場</text><text x="48" y="182" class="value">Uvanceとどろきスタジアム by Fujitsu (等々力陸上競技場)</text>

      <rect y="216" width="1024" height="62" rx="9" fill="#FFF7ED" stroke="#FED7AA"/><circle cx="28" cy="247" r="9" fill="#EA580C"/><text x="28" y="251" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">!</text><text x="48" y="242" font-size="12" font-weight="700" fill="#9A3412">自動入力の内容をご確認ください</text><text x="48" y="261" font-size="11" fill="#9A3412">元ページの表記を候補にしています。誤りや未記載項目はフォームで修正できます。</text>
    </g>
  </g>
</svg>
