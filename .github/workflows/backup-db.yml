name: Database Backup (AWS)

on:
  schedule:
    # Every day at 03:00 UTC (12:00 JST)
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate configuration
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          [[ -n "$EC2_INSTANCE_ID" ]] || { echo "EC2_INSTANCE_ID secret is not set" >&2; exit 1; }
          [[ -n "$S3_BUCKET" ]] || { echo "AWS_BACKUP_BUCKET repository variable is not set" >&2; exit 1; }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || { echo "EC2_INSTANCE_ID has an invalid format" >&2; exit 1; }
          [[ "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "AWS_BACKUP_BUCKET has an invalid format" >&2; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Back up SQLite from EC2 to S3 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
        run: |
          set -euo pipefail

          cat > /tmp/backup-db.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          S3_BUCKET="${1:?S3 bucket is required}"
          GITHUB_RUN_ID="${2:?GitHub run ID is required}"
          SERVICE="live-schedule-api"
          MAIN_PID="$(systemctl show "$SERVICE" --property=MainPID --value)"
          WORKING_DIR="$(systemctl show "$SERVICE" --property=WorkingDirectory --value)"

          if [[ -z "$MAIN_PID" || "$MAIN_PID" == "0" ]]; then
            echo "The $SERVICE service is not running." >&2
            exit 1
          fi

          DATABASE_URL="$(tr '\0' '\n' < "/proc/$MAIN_PID/environ" | sed -n 's/^DATABASE_URL=//p' | head -n 1)"
          [[ -n "$DATABASE_URL" ]] || DATABASE_URL="sqlite://data/app.db"

          export BACKUP_DATABASE_URL="$DATABASE_URL"
          export BACKUP_WORKING_DIR="$WORKING_DIR"
          BACKUP_DIR="$(mktemp -d /tmp/live-schedule-backup.XXXXXX)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          export BACKUP_DIR

          python3 <<'PYTHON'
          import os
          import pathlib
          import sqlite3

          database_url = os.environ["BACKUP_DATABASE_URL"].split("?", 1)[0]
          working_dir = pathlib.Path(os.environ["BACKUP_WORKING_DIR"] or ".")
          if database_url.startswith("sqlite://"):
              database_path = database_url[len("sqlite://"):]
          elif database_url.startswith("sqlite:"):
              database_path = database_url[len("sqlite:"):]
          else:
              raise SystemExit("DATABASE_URL is not SQLite; refusing to continue.")

          source = pathlib.Path(database_path)
          if not source.is_absolute():
              source = working_dir / source
          source = source.resolve()
          destination = pathlib.Path(os.environ["BACKUP_DIR"]) / "app.db"
          if not source.is_file():
              raise SystemExit(f"Database does not exist: {source}")

          source_connection = sqlite3.connect(f"file:{source}?mode=ro", uri=True, timeout=30)
          backup_connection = sqlite3.connect(destination)
          try:
              source_connection.backup(backup_connection)
          finally:
              backup_connection.close()
              source_connection.close()

          check_connection = sqlite3.connect(f"file:{destination}?mode=ro", uri=True)
          try:
              integrity = check_connection.execute("PRAGMA integrity_check").fetchone()[0]
              table_count = check_connection.execute(
                  "SELECT COUNT(*) FROM sqlite_master WHERE type='table'"
              ).fetchone()[0]
              try:
                  schedule_count = check_connection.execute("SELECT COUNT(*) FROM schedules").fetchone()[0]
              except sqlite3.Error:
                  schedule_count = "not available"
          finally:
              check_connection.close()

          if integrity != "ok":
              raise SystemExit(f"Backup integrity check failed: {integrity}")
          print(f"SQLite backup verified: tables={table_count}, schedules={schedule_count}")
          PYTHON

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          YEAR="${TIMESTAMP:0:4}"
          MONTH="${TIMESTAMP:4:2}"
          ARCHIVE="app.db.${TIMESTAMP}.gz"
          gzip -9c "$BACKUP_DIR/app.db" > "$BACKUP_DIR/$ARCHIVE"
          (cd "$BACKUP_DIR" && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          S3_PREFIX="s3://${S3_BUCKET}/database/${YEAR}/${MONTH}"

          aws s3 cp "$BACKUP_DIR/$ARCHIVE" "${S3_PREFIX}/${ARCHIVE}" \
            --only-show-errors \
            --sse AES256 \
            --metadata "github-run-id=${GITHUB_RUN_ID:-unknown},integrity=ok"
          aws s3 cp "$BACKUP_DIR/$ARCHIVE.sha256" "${S3_PREFIX}/${ARCHIVE}.sha256" \
            --only-show-errors \
            --sse AES256
          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "database/${YEAR}/${MONTH}/${ARCHIVE}" \
            --query '{Size:ContentLength,Encryption:ServerSideEncryption,Metadata:Metadata}'
          echo "Backup completed: ${S3_PREFIX}/${ARCHIVE}"
          REMOTE_SCRIPT

          SCRIPT_BASE64="$(base64 -w 0 /tmp/backup-db.sh)"
          REMOTE_COMMAND="echo '$SCRIPT_BASE64' | base64 -d > /tmp/backup-db.sh && chmod 700 /tmp/backup-db.sh && sudo /tmp/backup-db.sh '$S3_BUCKET' '$GITHUB_RUN_ID'"
          PARAMETERS="$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')"
          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Back up live-schedule-api SQLite to S3" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text
          )"
          echo "SSM command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          exit "$WAIT_STATUS"

      - name: Report failure
        if: failure()
        run: echo "::error::Database backup failed. Check the SSM command output above."
