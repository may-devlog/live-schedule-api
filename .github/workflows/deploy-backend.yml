name: Deploy Backend (AWS EC2)

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  backup:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/backup-db.yml
    secrets: inherit

  deploy:
    needs: backup
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Deploy via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["set -e","sudo git config --system --add safe.directory /opt/live-schedule-api","sudo chown -R ec2-user:ec2-user /opt/live-schedule-api","sudo -u ec2-user bash -lc '\''cd /opt/live-schedule-api && git fetch origin && git reset --hard origin/master && cd backend && source /home/ec2-user/.cargo/env && cargo build --release'\''","sudo systemctl restart live-schedule-api"]' \
              --query "Command.CommandId" \
              --output text
          )

          # `aws ssm wait command-executed` gives up after its built-in ~100s
          # polling window, which is shorter than `cargo build --release` can
          # take on the EC2 instance. That made this step report failure even
          # when the deploy went on to complete successfully in the
          # background. Poll manually instead, with a timeout generous enough
          # to cover a full release build (up to 20 minutes).
          # A short initial delay avoids racing the command invocation
          # record, which can take a moment to become queryable right after
          # send-command; the `|| echo Pending` fallback covers that same
          # window if it's still not ready on the first poll.
          sleep 5
          STATUS="InProgress"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/80] status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command did not succeed (status=$STATUS)"
            exit 1
          fi
