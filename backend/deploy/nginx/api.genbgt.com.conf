# 本番環境（AWS EC2）で実際に稼働している設定を反映したもの。
# TLS証明書はCertbot（Let's Encrypt）で発行・自動更新している。
# サーバーへ変更を反映する場合は、このファイルをコピーした上で
# `sudo nginx -t && sudo systemctl reload nginx` で反映すること。

server {
    server_name api.genbgt.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # サーバー情報の漏洩を減らす
    server_tokens off;

    # 常にHTTPS経由でアクセスさせる（HSTS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # MIMEタイプスニッフィングを無効化
    add_header X-Content-Type-Options "nosniff" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.genbgt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.genbgt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.genbgt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name api.genbgt.com;
    return 404; # managed by Certbot
}
